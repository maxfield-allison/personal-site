name: Deploy

# Hybrid deploy for the portfolio site.
#   1. Build the static site and publish it to Cloudflare Pages (external mirror
#      / failover, zero homelab footprint).
#   2. Build a container image and push to ghcr.io. The homelab Kubernetes
#      cluster (via ArgoCD Image Updater) picks that up and serves the primary
#      origin from maxfieldallison.com.
#
# Direction is one-way: GitHub is the source of truth.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with Pages:Edit for the account
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account id
# (GITHUB_TOKEN is provided automatically for ghcr push.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    # Enabled once maxfieldallison.com is onboarded to Cloudflare and a
    # Pages-scoped token is set. Set repo variable ENABLE_CLOUDFLARE_PAGES=true
    # and secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID to turn this on.
    if: ${{ vars.ENABLE_CLOUDFLARE_PAGES == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=personal-site --branch=main

  image:
    name: Container image (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/maxfield-allison/personal-site:latest
            ghcr.io/maxfield-allison/personal-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
