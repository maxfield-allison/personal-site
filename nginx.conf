worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache hashed static assets aggressively; HTML stays fresh.
    map $uri $cache_control {
        default                 "public, max-age=3600";
        ~*\.(css|js|woff2?)$    "public, max-age=31536000, immutable";
        ~*\.(png|jpg|jpeg|gif|svg|ico|webp)$ "public, max-age=604800";
        ~*\.html$               "public, max-age=0, must-revalidate";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Never emit absolute redirects: behind a reverse proxy an absolute
        # Location would leak this origin's internal host and port.
        absolute_redirect off;
        port_in_redirect off;

        # Security headers.
        #
        # These were previously added only by Cloudflare, which meant anything
        # reaching this origin directly got a much weaker set. They are declared
        # here so the origin is safe on its own and the edge is defence in
        # depth. Where both set a header the browser enforces the intersection,
        # so these are written to agree with the edge rather than fight it.
        #
        # NOTE: nginx `add_header` is not additive across contexts. Any location
        # block that declares its own add_header drops every header inherited
        # from here, so such blocks must restate the full set. See /zeroday.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # SAMEORIGIN rather than DENY: the edge already sends SAMEORIGIN, and
        # two different values across the chain is worse than one slightly
        # looser one. Real framing control comes from frame-ancestors below.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=()" always;

        # Content-Security-Policy.
        #
        # script-src can be a bare 'self' because the site has no inline
        # scripts at all: the one behavioural script is served from
        # /js/read-tracker.js precisely so this stays true. If you ever add an
        # inline <script>, this policy will block it — move the code to a file
        # under public/js/ rather than weakening the policy or adding a hash.
        #
        # style-src needs 'unsafe-inline': Astro emits a small inline <style>
        # block and view transitions set inline style attributes, which cannot
        # be hashed. Inline style is a far weaker vector than inline script.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

        add_header Cache-Control $cache_control;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Flat-file build: /about serves /about.html directly, no redirect.
        # Root and any dir serve their index.html explicitly (naming the file
        # avoids the trailing-slash directory redirect that leaks the origin).
        # Unknown paths return a real 404 with the custom page.
        location / {
            try_files $uri $uri.html $uri/index.html @notfound;
        }

        location @notfound {
            return 404;
        }

        # Serve the custom 404 body, but never let a CDN cache a negative
        # response: a 404 for a not-yet-deployed asset would otherwise get
        # cached and keep 404ing after the asset ships.
        error_page 404 /404.html;
        location = /404.html {
            internal;
            add_header Cache-Control "no-store" always;
        }
    }
}
